id: task_001

repository: pydantic-ai

base_commit: "ba121fcab18f0af618bc443a300a40705750ac8e"
# gold fix commit (do not expose to the agent): c3bd96c31c9c8d606fa9c9b807d971ea14376a71
# source PR: https://github.com/pydantic/pydantic-ai/pull/7905

title: "RealtimeSession.send_audio does not roll back user-turn state on a non-bytes chunk"

description: |
  `RealtimeSession.send_audio` accepts either a single `bytes` chunk or an
  async iterable of chunks. When a chunk is not bytes-like, the retention
  buffer's `extend(data)` call raises outside the method's rollback `try`
  block. That means `_user_turn_active` is left set (and a pending turn
  anchor exists) with nothing actually buffered or sent — producing a
  phantom empty user turn at the next boundary.

  Fix `send_audio` so that a non-bytes chunk rolls the user-turn state back
  to what it was before the call, in the same way other mid-call failures
  already do.

category: bug_fix
difficulty: easy

setup:
  # Do NOT run `uv sync --all-groups` for a task this narrow — it pulls in
  # boto3-stubs, tavily, exa, duckduckgo-search, fastmcp, etc. that this
  # test file never imports. Install only the local workspace package plus
  # what tests/conftest.py actually imports.
  command: |
    pip install -e ./pydantic_graph -e "./pydantic_ai_slim[realtime]" \
      pytest anyio inline-snapshot dirty-equals httpx asgi-lifespan \
      pytest-mock pytest-recording devtools
  env:
    BLOCKBUSTER_ENABLED: "false"   # blockbuster isn't in the dev deps above; disable rather than pull it in

tests:
  fail_to_pass:
    - "tests/realtime/test_session.py::test_send_audio_first_chunk_bad_rolls_back_turn_state"

  # NOTE: the PR's diff added TWO new test functions, but only one of them
  # is actually F2P. `test_send_audio_bad_later_chunk_keeps_earlier_chunks`
  # already passes on base_commit (it pins existing correct behavior for a
  # different code path). Verified empirically — see validate_task.sh.
  # Treat it as P2P, not F2P.
  pass_to_pass:
    - "tests/realtime/test_session.py::test_send_audio_bad_later_chunk_keeps_earlier_chunks"
    - "tests/realtime/test_session.py"   # full file, 295 tests, must stay green

timeout_seconds: 900
